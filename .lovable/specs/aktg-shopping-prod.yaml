            enum:
              - 1
            type: int
        - name: pageSize
          in: query
          description: Number of items per page
          schema:
            enum:
              - 20
            type: int
        - name: priceTypeCod
          in: query
          description: Price Type Code
          schema:
            enum:
              - FIT
            type: string
            default: FIT
        - name: voyageNumber
          in: query
          description: Voyage Number
          schema:
            type: string
        - name: ApiKey
          in: header
          description: The provided ApiKey to access the API
          required: true
          schema:
            type: string
      responses:
