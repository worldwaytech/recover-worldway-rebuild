openapi: 3.0.1
info:
  title: Shopping API (Prod)
  description: '*** Production *** APIs to retrieve information about Crystal Cruises sailings, itineraries, prices and availability.'
  version: '1.0'
servers:
  - url: https://api.aktravelgroup.com/shopping
paths:
  /v1/flatfiles/cruiseprices:
    get:
      summary: Price Feed Flat File
      description: "This endpoint provides a CSV-style response of cruise prices, per price type, currency and suite category.\nThe fields are comma separated and if a field contains a comma in its value it will be surrounded by double quotes. If a field value contains a double quote, it will be escaped with a backslash (\\\\\").\nThe first row represents the header, with the column names."
      operationId: price-feed-flat-file
      parameters:
        - name: currency
          in: query
          description: Currency Code
          required: true
          schema:
            type: string
        - name: priceTypeCod
          in: query
          description: Price Type Code
          schema:
            enum:
              - FIT
            type: string
            default: FIT
        - name: ApiKey
          in: header
          description: The provided ApiKey to access the API
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'null'
  /d/v1/products/cruises:
