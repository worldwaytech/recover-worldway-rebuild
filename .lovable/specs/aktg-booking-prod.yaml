openapi: 3.0.1
info:
  title: Booking API (PROD)
  description: Set of API related to the booking process. Please go <a href='https://apiportal.aktravelgroup.com/booking-api'>this page</a> for further information
  version: '1.0'
servers:
  - url: https://api.aktravelgroup.com/bookingapi
paths:
  /v1/Bookings/option:
    post:
      tags:
        - Bookings
      summary: Send an Option creation request
      description: Send an Option creation request
      operationId: post-v1-bookings-option
      parameters:
        - name: ApiKey
          in: header
          description: The provided ApiKey to access the API
          required: true
          schema:
            type: string
        - name: X-SalesChannel
          in: header
          description: The provided SalesChannel for accessing the booking API
          required: true
          schema:
            type: string
        - name: X-OfficeID
          in: header
          description: The code to identify the calling agency
          required: true
          schema:
            type: string
      requestBody:
        description: Details about option creation request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionCreationRequest'
            example:
              guests:
                - title: Mr
                  firstName: John
                  lastName: Doe
                  email: john.doe@example.com
                  phone: +1 (123) 456-7890
                  gender: string
                  countryISO3Code: USA
                  guestType: Adult
                  crystalSocietyMember: true
                  crystaSocietyNumber: '12345678'
              agentEmail: jane.doe@travelagency.com
              priceTypeCode: FIT
              currency: USD
              voyages:
                - voyageNumber: CSE-012-230609
                  suiteCategoryCode: SVVM
                  suiteNumber: 10040
              note: Booking notes
      responses:
        '201':
          description: Option created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteOptionCreationResponse'
              example:
                id: 0
        '400':
          description: Option creation request has missing/invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: string
                title: string
                status: 0
                detail: string
                instance: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: string
                title: string
                status: 0
                detail: string
                instance: string
        '404':
          description: One of the selected suites is not available/found or agency not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: string
                title: string
                status: 0
                detail: string
                instance: string
