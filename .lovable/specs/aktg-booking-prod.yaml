components:
  schemas:
    BookingCommissionDto:
      type: object
      properties:
        commission:
          type: number
          description: Commission value
          format: double
          nullable: true
          example: 5
        valueType:
          type: string
          description: Commission value type (Amount/Percentage)
          nullable: true
          example: Percentage
        commissionTypeID:
          type: integer
          description: Commission type ID
          format: int32
          nullable: true
          example: 10
        commissionType:
          type: string
          description: Commission type
          nullable: true
          example: Cruise
      additionalProperties: false
      description: Details about a commission
    BookingCommissionItemBreakdownDto:
      type: object
      properties:
        sectionID:
          type: integer
          description: Section ID of the booking
          format: int32
          nullable: true
          example: 1
        commissionTypeID:
          type: integer
          description: Commission type ID of the item
          format: int32
          nullable: true
          example: 10
        commission:
          type: number
          description: Commission value of item
          format: double
          nullable: true
          example: 5
        serviceTypeName:
          type: string
          description: Name of the service type which the commission was applied to
          nullable: true
          example: '5.00'
        serviceName:
          type: string
          description: Name of the service which the commission was applied to
          nullable: true
          example: '5.00'
        optionName:
          type: string
          description: Name of the option which the commission was applied to
          nullable: true
          example: '5.00'
        sellingPriceCurrency:
          type: string
          description: Selling price currency of the item
          nullable: true
          example: USD0
        sellingPrice:
          type: number
          description: Selling price of the item
          format: double
          nullable: true
          example: 1
        portCharge:
          type: number
          description: Port charge amount of the voyage
          format: double
          nullable: true
          example: 1
        sellingPriceTax:
          type: number
          description: NCF amount of the voyage
          format: double
          nullable: true
          example: 1
        itineraryDate:
          type: string
          description: Date of the item which the commission was applied to
          format: date-time
          nullable: true
          example: '2023-10-25T12:00:00.0000000+00:00'
        guestCode:
          type: integer
          description: ''
          format: int32
          nullable: true
      additionalProperties: false
      description: Details about a commission breakdown
    BookingCommissionVoyageBreakdownDto:
      type: object
      properties:
        sectionID:
          type: integer
          description: Section ID of the booking
          format: int32
          nullable: true
          example: 1
        voyageName:
          type: string
          description: Name of the voyage which the commission was applied to
          nullable: true
          example: Magic trip
        voyageID:
          type: integer
          description: Id of the voyage which the commission was applied to
          format: int32
          nullable: true
          example: 1
        commissionTypeID:
          type: integer
          description: Commission type ID
          format: int32
          nullable: true
          example: 10
        commission:
          type: number
          description: Commission value
          format: double
          nullable: true
          example: 5
        serviceTypeName:
          type: string
          description: Name of the service type which the commission was applied to
          nullable: true
          example: '5.00'
        sellingPrice:
          type: number
          description: Selling price of the voyage
          format: double
          nullable: true
          example: 1
        tax:
          type: number
          description: Tax amount of the voyage
          format: double
          nullable: true
          example: 1
        portCharge:
          type: number
          description: Port charge amount of the voyage
          format: double
          nullable: true
          example: 1
        ncf:
          type: number
          description: NCF amount of the voyage
          format: double
          nullable: true
          example: 1
        commissionBase:
          type: number
          description: Commission base amount of the voyage
          format: double
          nullable: true
          example: 1
        totalCruiseDiscount:
          type: number
          description: Total discount of the voyage
          format: double
          nullable: true
          example: -1
        travelStartDate:
          type: string
          description: Travel start date of the voyage
          format: date-time
