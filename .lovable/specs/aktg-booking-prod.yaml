          maxLength: 80
          type: string
          description: Guest email - For Option creation at least one guest should have a valid email address
          format: email
          example: john.doe@example.com
        phone:
          maxLength: 25
          type: string
          description: Guest phone
          nullable: true
          example: +1 (123) 456-7890
        gender:
          maxLength: 1
          pattern: M|F
          type: string
          description: Guest gender - M or F
          nullable: true
        countryISO3Code:
          maxLength: 3
          minLength: 3
          type: string
          description: Guest country ISO3 code
          nullable: true
          example: USA
        zip:
          type: string
          description: Guest ZIP code
          nullable: true
          example: 60515-1098
        city:
          type: string
          description: Guest city
          nullable: true
          example: Downers Grove
        countryCode:
          type: string
          description: Guest country code
          nullable: true
          example: USA
        country:
          type: string
          description: Guest country
          nullable: true
          example: United States of America
        stateCode:
          type: string
          description: Guest state code (if applicable)
          nullable: true
          example: IL
        guestType:
          pattern: Adult|Child
          type: string
          description: 'Guest type, Adult or Child - Default Adult'
          nullable: true
          example: Adult
