        - firstName
        - lastName
      type: object
      properties:
        title:
          type: string
          description: Guest title
          nullable: true
          example: Mr
        firstName:
          maxLength: 128
          minLength: 1
          type: string
          description: Guest first name
          example: John
        lastName:
          maxLength: 128
          minLength: 1
          type: string
          description: Guest last name
          example: Doe
