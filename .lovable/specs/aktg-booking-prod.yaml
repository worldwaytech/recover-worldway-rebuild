          type: boolean
          description: True if the guest is a Crystal Society member
          example: true
        crystaSocietyNumber:
          maxLength: 30
          type: string
          description: 'PLEASE NOTE: Not yet used. Guest Crystal Society Number, if you don''t remember the number leave it empty and set to true the CrystalSocietyMember property'
          nullable: true
          example: '12345678'
      additionalProperties: false
      description: Details about guest
