# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - worldwayluxe-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production application
        run: npm run build

      - name: Verify Nitro production server
        run: |
          if [ ! -f .output/server/index.mjs ]; then
            echo "ERROR: .output/server/index.mjs was not generated by the production build."
            echo "Build directory contents:"
            find .output -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi
          echo "Verified: .output/server/index.mjs exists."

      - name: Run tests if present
        run: npm run test --if-present

      - name: Upload complete deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Verify deployment artifact
        run: |
          if [ ! -f .output/server/index.mjs ]; then
            echo "ERROR: .output/server/index.mjs is missing from the deployment artifact."
            echo "Artifact contents:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi
          echo "Verified deployment artifact contains .output/server/index.mjs."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6FBD42876C6B4869B14E7E3E03EFE7C8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DFB8C730778341FA860A2F186F4FBD68 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3D19F8F6C14F48958D0A2171D3FD5E6E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'worldwayluxe-prod'
          slot-name: 'Production'
          package: .
