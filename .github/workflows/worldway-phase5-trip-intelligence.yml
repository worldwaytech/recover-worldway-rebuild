name: Worldway Phase 5 Trip Intelligence

on:
  pull_request:
    paths:
      - "src/lib/engine/chronology.ts"
      - "src/lib/engine/__tests__/chronology.phase5.test.ts"
      - "src/lib/engine/package.ts"
      - "src/lib/engine/types.ts"
      - "src/lib/engine/suppliers/assembly.server.ts"
      - "src/lib/engine/__tests__/pipeline.test.ts"
      - "src/lib/engine/__tests__/phase5-multicity.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/worldway-phase5-trip-intelligence.yml"
  push:
    branches:
      - phase-5-trip-intelligence

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Repository lockfile is currently not synchronized with package.json; use the same deterministic dependency strategy as production CI.
      - run: npm install -g npm@12.2.0 && npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test -- --run src/lib/engine/__tests__/chronology.phase5.test.ts src/lib/engine/__tests__/pipeline.test.ts src/lib/engine/__tests__/phase5-multicity.test.ts
