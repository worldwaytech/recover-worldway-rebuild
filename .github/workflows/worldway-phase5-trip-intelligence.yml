name: Worldway Phase 5 Trip Intelligence

on:
  pull_request:
    paths:
      - "src/lib/engine/chronology.ts"
      - "src/lib/engine/__tests__/chronology.phase5.test.ts"
      - "src/lib/engine/package.ts"
      - "src/lib/engine/types.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/worldway-phase5-trip-intelligence.yml"
  push:
    branches:
      - phase-5-trip-intelligence

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run src/lib/engine/__tests__/chronology.phase5.test.ts src/lib/engine/__tests__/pipeline.test.ts
