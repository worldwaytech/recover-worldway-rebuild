name: Worldway Phase 16 Global Travel Commerce Intelligence Network

on:
  push:
    branches:
      - main
      - phase-16-global-travel-commerce-intelligence-network
      - phase-16-post-phase15-consolidated
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm install --no-audit --no-fund --package-lock=false --legacy-peer-deps
      - run: npm run typecheck
      - run: npx eslint --rule 'prettier/prettier: off' src/lib/engine/global-travel-intelligence.ts src/lib/engine/__tests__/phase16-global-travel-intelligence.test.ts
      - run: npm test -- --run
      - run: npm run build
