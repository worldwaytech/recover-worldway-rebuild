name: Worldway AWS Container Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - "src/**"
      - "app/**"
      - "routes/**"
      - "components/**"
      - "Dockerfile"
      - ".github/workflows/aws-container-build.yml"
  workflow_dispatch:

concurrency:
  group: worldway-aws-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: worldwaytravelsgroup:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
